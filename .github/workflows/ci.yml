name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No `npm install`: the package has zero dependencies and no build step.
      - name: Run tests
        run: npm test   # scripts/run-tests.mjs enumerates the files (Node 20 has no --test glob)

      - name: Scan for committed secrets
        run: node scripts/check-secrets.mjs

      - name: Verify the server starts and answers a handshake
        run: node scripts/handshake-check.mjs

      # Linux-only: proves the packed tarball (what `npx github:` installs) runs.
      - name: Verify the published tarball runs from an install
        if: runner.os == 'Linux'
        run: |
          TGZ="$(npm pack --silent | tail -n 1)"
          mkdir -p /tmp/agc-install && cd /tmp/agc-install
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$TGZ" --no-audit --no-fund
          node -e "const m=require('/tmp/agc-install/node_modules/agc-analytics-mcp/package.json');console.log('installed',m.name,m.version)"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | node node_modules/agc-analytics-mcp/index.js 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const t=JSON.parse(s.trim()).result.tools;if(t.length!==13)process.exit(1);console.log('installed bin answers with',t.length,'tools')})"
